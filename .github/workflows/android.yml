name: Android APK

# Pushes to main publish a signed release (v1.0.N) with dropi.apk attached; other branches are
# build checks. Docs-only changes don't build. Same pipeline as F1 Pro.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "licenses/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, for the "What's new" list in the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Reuse compiled pieces from earlier runs on every branch, not just main.
          cache-read-only: false

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dropi-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/dropi-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build
        # One Gradle run instead of two cold ones.
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          # Tests run against the release build, so the app compiles once instead of twice.
          ./gradlew testReleaseUnitTest assembleRelease --build-cache --parallel 2>&1 | tee build.log

      # GitHub keeps 10 error annotations per step, so compile errors are reported in batches.
      - name: Report errors (1-10)
        if: failure()
        shell: bash
        run: |
          { grep -E "^e: |error:|ERROR|expected:<|Exception at|FAILED$" build.log; grep -A 10 "What went wrong" build.log; } \
            | grep -v "^--$" | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's#/home/runner/work/[^/]*/[^/]*/##' \
            | awk 'NF && !seen[$0]++' > errors.txt || true
          { echo '### Build errors'; echo '```'; head -200 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,10p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (11-20)
        if: failure()
        run: sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (21-30)
        if: failure()
        run: sed -n '21,30p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (31-40)
        if: failure()
        run: sed -n '31,40p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Report errors (41-50)
        if: failure()
        run: sed -n '41,50p' errors.txt | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk dropi.apk
          echo "::notice::APK $(( $(stat -c %s dropi.apk) / 1024 )) KB"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v6
        with:
          name: dropi-apk
          path: dropi.apk
          retention-days: 14

      - name: Release notes
        run: |
          {
            echo "Tap **dropi.apk** below on your phone to install or update."
            echo
            # What's new: commit titles since the previous release tag.
            prev=$(git describe --tags --abbrev=0 --match 'v1.0.*' HEAD^ 2>/dev/null || true)
            # Highlights: the hand-written, people-facing list in whatsnew.md, when it was
            # updated for this release. The app's "What's new" window shows these.
            if [ -f whatsnew.md ] && { [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- whatsnew.md; }; then
              echo "### Highlights"
              grep '^- ' whatsnew.md | head -10
              echo
            fi
            if [ -n "$prev" ]; then
              echo "### What's new since $prev"
              git log --no-merges --pretty='- %s' "$prev..HEAD" | head -25
              echo
            fi
            echo "Dropi — blood sugar tracker for Android. Built from ${GITHUB_SHA}."
          } > notes.md

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dropi 1.0.${{ github.run_number }}
          body_path: notes.md
          files: dropi.apk
          make_latest: true

      # After the release is out: Android's own checks, as a report only.
      - name: Lint report
        # Android's own checks (manifest, API levels, resources, accessibility). A report only:
        # it never fails the build. The full list is in the run summary.
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew lintDebug > /dev/null 2>&1 || true
          f=app/build/reports/lint.txt
          [ -f "$f" ] || { echo "::warning::No lint report"; exit 0; }
          summary=$(grep -E '^[0-9]+ errors?, [0-9]+ warnings?' "$f" | tail -1)
          echo "::notice title=Lint::${summary:-No issues}"
          grep -E ': Error: ' "$f" | head -10 | sed 's#^.*/app/src/#app/src/#' | while IFS= read -r l; do echo "::warning title=Lint error::$l"; done || true
          echo "::notice title=Lint findings::$(grep -E ': (Warning|Error|Information|Hint): ' "$f" | sed -E 's#^.*/(app|gradle)/#\1/#; s#^([^:]+:[0-9]+): [A-Za-z]+: (.{0,70}).* \[([^]]+)\]$#\1 [\3] \2#' | head -120 | sed ':a;N;$!ba;s/\n/%0A/g')"
          { echo '### Lint'; echo '```'; head -300 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

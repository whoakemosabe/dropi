name: Diag screenshots
on:
  push:
    branches: ["diag-mlkit"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew -q :app:assembleDebug
          cp $(find app/build/outputs/apk/debug -name "*.apk" | head -1) $RUNNER_TEMP/app.apk
          mkdir -p $RUNNER_TEMP/shots
          cat > $RUNNER_TEMP/t.sh <<'S'
          adb install -r $RUNNER_TEMP/app.apk
          adb shell pm grant app.dropi android.permission.POST_NOTIFICATIONS || true
          shot() { adb shell am start -S -n app.dropi/.MainActivity --es shot_tab $1 --es shot_theme $2 $3 >/dev/null; sleep $4; adb exec-out screencap -p > $RUNNER_TEMP/shots/$5.png; }
          shot TODAY dark "" 22 today-dark
          shot TODAY dark "" 6 today-dark2
          shot TRENDS dark "" 8 trends-dark
          shot TRENDS dark "--ez shot_more true" 8 trends-more
          shot MEALS dark "" 8 meals-dark
          shot MEALS dark "--ez shot_meal true" 10 meal-sheet
          shot TODAY light "" 8 today-light
          shot TODAY dracula "" 8 today-dracula
          shot MORE dark "" 8 more-dark
          S
          chmod +x $RUNNER_TEMP/t.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: $RUNNER_TEMP/t.sh
      - name: Save
        if: always()
        run: |
          cd $GITHUB_WORKSPACE && git checkout -- . && git clean -fdq
          mkdir -p shots && cp $RUNNER_TEMP/shots/*.png shots/ || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add shots && git commit -qm "shots [skip ci]" && git push origin HEAD:diag-mlkit
